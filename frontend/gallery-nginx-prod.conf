server {
    listen 80;
    server_name 150.230.56.153;

    return 301 https://$host$request_uri;
}

server {
    # HTTP/2 multiplexes the ~70 module/CSS requests of a cold gallery load over one
    # connection instead of six HTTP/1.1 connections (nginx >= 1.25.1 also accepts the
    # newer `http2 on;` directive; this form works on every nginx with HTTP/2 support).
    listen 443 ssl http2;
    server_name 150.230.56.153;

    ssl_certificate /etc/nginx/ssl-gallery/gallery.crt;
    ssl_certificate_key /etc/nginx/ssl-gallery/gallery.key;
    auth_basic "Gallery";
    auth_basic_user_file /etc/nginx/ssl-gallery/gallery.htpasswd;
    client_max_body_size 1m;

    # Compression: the default nginx.conf only gzips text/html, which left ~1 MB of
    # JavaScript/CSS uncompressed (~0.4 MB gzipped). Images, video and woff2 fonts are
    # already compressed and are not listed; neither is text/event-stream, so the
    # /api/events SSE stream is never compressed or held back.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # ═══════════════════════════════════════
    # PRODUCTION MODE: serve Vue SPA dist
    # ═══════════════════════════════════════
    root /home/ubuntu/gallery-repo/frontend/dist;
    index index.html;

    # Vite fingerprints every file under /assets/ (content hash in the name), so it can be
    # cached for a year without revalidation; a new build ships new file names.
    #
    # Pre-compressed files: `pnpm run build` writes `<file>.br` (Brotli q11) and `<file>.gz`
    # (gzip 9) next to every text asset. `gzip_static` serves the `.gz` to gzip clients with
    # stock nginx. `brotli_static` serves the `.br` (about 12% smaller than gzip on the
    # mount-critical JavaScript) and needs the Brotli module, which Ubuntu ships separately:
    #
    #   sudo apt install libnginx-mod-http-brotli-static libnginx-mod-http-brotli-filter
    #
    # The packages drop `load_module` snippets into /etc/nginx/modules-enabled/ (nginx.conf
    # includes that directory), so no manual `load_module` is normally needed. If your nginx
    # does not include it, add these two lines at the top of nginx.conf, outside http {}:
    #
    #   load_module modules/ngx_http_brotli_filter_module.so;
    #   load_module modules/ngx_http_brotli_static_module.so;
    #
    # Without the module nginx refuses to start on an unknown `brotli_static` directive, so
    # install the packages (and `sudo nginx -t`) before adding the line to the live file.
    # Dynamic `gzip on` above stays the fallback for any file without a pre-compressed copy.
    location /assets/ {
        brotli_static on;
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Landing pages (the intro iframe) keep their original, unhashed file names, so `immutable` would
    # pin stale files. A day of freshness avoids revalidating ~20 files on every intro view; after that
    # nginx's ETag/Last-Modified give a cheap 304. The pages switch day/night in place, so there is no
    # reload that needs revalidation. `try_files` keeps directory URLs on their index.html.
    location /landpage/ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri $uri/ =404;
    }

    # index.html (and every SPA route that falls back to it) must be revalidated so a new
    # build is picked up on the next visit.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        include /etc/nginx/snippets/gallery-proxy-secret.conf;
        proxy_pass http://127.0.0.1:4701;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}
