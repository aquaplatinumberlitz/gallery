server {
    listen 80;
    server_name 150.230.56.153;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 150.230.56.153;

    ssl_certificate /etc/nginx/ssl-gallery/gallery.crt;
    ssl_certificate_key /etc/nginx/ssl-gallery/gallery.key;
    auth_basic "Gallery";
    auth_basic_user_file /etc/nginx/ssl-gallery/gallery.htpasswd;
    client_max_body_size 1m;

    # ═══════════════════════════════════════
    # PRODUCTION MODE: serve Vue SPA dist
    # ═══════════════════════════════════════
    root /home/ubuntu/gallery-repo/frontend/dist;
    index index.html;
    try_files $uri $uri/ /index.html;

    location /api {
        include /etc/nginx/snippets/gallery-proxy-secret.conf;
        proxy_pass http://127.0.0.1:4701;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}
