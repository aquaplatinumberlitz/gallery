# Single source of truth for all performance budgets in the gallery-repo test suite.
#
# Every budget consumed by `scripts/perf_*.py`, `scripts/bench_*.py`, or
# `frontend/tests/e2e/perf/*.perf.spec.ts` MUST be declared here. The validator
# `scripts/check_perf_budgets.py` enforces that:
#   * every section below has at least one consuming test file
#   * every perf test file references a budget declared here
#
# Frontend (Playwright) budgets are mirrored into
# `frontend/tests/e2e/perf/perf-budgets.json` and consumed via `perf-utils.ts`.
# Keep the two files in sync — the validator checks this too.
#
# To add a new budget:
#   1. Add a `[section]` block here with the numeric fields and a `description`.
#   2. If consumed by a Playwright spec, mirror the section into
#      `frontend/tests/e2e/perf/perf-budgets.json`.
#   3. Register the workload, consumer, suite, tokens, and reports in
#      `scripts/perf_manifest.toml`.
#   4. Record whether the threshold is published-standard-derived or
#      baseline-derived, including source/calibration evidence.
#   5. Re-run `python3 scripts/check_perf_budgets.py` to confirm coverage.

[inspector]
p95_ms = 500
description = "/api/library/inspector P95 latency"

[facets]
p95_ms = 3000
description = "/api/facets P95 latency over the managed 100k catalog"

[warm_listing]
budget_ms = 500
description = "Warm SQLite listing vs cold scan"

[album_open]
scan_p95_ms = 2000
first_thumbnail_ms = 3000
warm_batch_complete_ms = 800
description = "Playwright: album open scan + first thumbnail + warm visible-thumbnail batch completion"

[lightbox]
open_ms = 200
transition_ms = 200
visual_ready_ms = 1000
description = "Playwright: browser-native first feedback and decoded visual readiness"
# Google Web Vitals defines good INP as <=200 ms at p75. The controlled lab
# gate applies the same target to first feedback and next-slide interactions.
interaction_basis = "Google Web Vitals INP"
interaction_basis_url = "https://web.dev/articles/inp"
# Google RAIL places view changes in the 100-1000 ms continuity window. This
# custom decoded-preview metric uses the upper bound; it is not a Core Web Vital.
visual_ready_basis = "Google RAIL view-change continuity window"
visual_ready_basis_url = "https://web.dev/articles/rail"

[preview]
cold_p95_ms = 1500
warm_p95_ms = 100
description = "Preview generation: cold render vs warm persisted derivative response"

[metadata_nav]
api_ms = 2000
nav_ms = 2000
render_ms = 2000
rendered_rows_max = 25
sort_ms = 2000
search_debounce_ms = 3000
search_requests_max = 3
state_restore_ms = 2000
description = "Playwright: metadata panel navigation, render, search, state restore"

[search]
p95_ms = 300
ci_rows = 5000
scheduled_rows = 25000
description = "/api/search lexical P95 latency and managed fixture profiles"

[related_assets]
rows = 100000
metadata_p95_ms = 150
visual_p95_ms = 75
combined_p95_ms = 200
lexical_p95_ms = 300
# Baseline-derived: CI observed lexical backfill regression variance of 12-18%
# across 5 runs on the 100k fixture (writer thread contending on the same SQLite
# connection as the read path). 20% headroom absorbs that variance without
# masking a real regression (capped below 25% to keep the gate meaningful).
# Calibration evidence: scripts/bench_related_assets.py --profile=ci on
# 2026-07-21, p95 baseline 280-305ms, during-backfill 330-355ms.
backfill_regression_pct = 20
visual_worker_rss_mib = 64
storage_mib = 100
description = "100k Related Assets latency, lexical isolation, worker RSS, and SQLite growth"

[inspector_metadata]
p95_ms = 200
description = "/api/library/inspector/metadata P95 latency"

[thumbnail]
cold_p95_ms = 1000
warm_p95_ms = 50
description = "Thumbnail generation: cold (no cache) vs warm (cached)"

[worker_contention]
# Phase 0 exit-gate metrics (docs/plans/WORKER_LIFECYCLE_HARDENING_PLAN.md, H2).
status_p95_ms = 500
polling_throughput_ratio = 0.90
max_write_lock_hold_ms = 1000
database_locked_log_lines = 0
lease_loss_failed_scans = 0
# Phase 1 targets: always measured and reported, enforced only with `--phase 1`.
orphan_running_metadata_jobs = 0
superseded_ready_derivatives = 0
# Workload sizing. An under-sized run fails as an empty workload instead of passing.
min_derivative_jobs = 36000
min_metadata_jobs_queued = 1000
throughput_window_seconds = 120
phase0_metrics = [
  "status_p95_ms",
  "polling_throughput_ratio",
  "max_write_lock_hold_ms",
  "database_locked_log_lines",
  "lease_loss_failed_scans",
]
phase1_metrics = ["orphan_running_metadata_jobs", "superseded_ready_derivatives"]
description = "Worker starvation under status polling: status latency, polling throughput ratio, write-lock hold, lease loss"
# Baseline-derived from the 2026-10-27 worker audit (1,500 images, 36,000 derivative_jobs rows):
# the status p95 ceiling reuses the repo-wide 500 ms API budget; the throughput ratio, lock-hold
# and zero-count budgets are the audit's acceptance criteria (WK-01, WK-02, WK-03), not
# vendor-published thresholds. Phase 2 tightens max_write_lock_hold_ms to 250.
