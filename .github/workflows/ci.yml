# GitHub Actions CI — Lint, format, build, and test
#
# Runs on push/PR to main.
# Uses changed-files-only for ruff/prettier (advisory), full-scan for ESLint.
---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # needed for changed-file diff against origin/main

      # ---- Backend (Ruff) ----
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Backend Ruff lint (changed files)
        run: bash scripts/lint_backend.sh
        env:
          RUFF_BASE: origin/main

      - name: Backend Ruff format check (changed files)
        run: bash scripts/format_backend_check.sh
        env:
          RUFF_BASE: origin/main

      # ---- Frontend (ESLint + Prettier) ----
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend ESLint
        working-directory: frontend
        run: pnpm lint

      - name: Frontend Prettier check (changed files)
        working-directory: frontend
        run: pnpm format:check
        env:
          PRETTIER_BASE: origin/main

  test-unit:
    name: test:unit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Backend Unit & Integration Tests
        run: python -m pytest backend/tests/ -x -q --cov=backend --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Upload backend coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: coverage.xml

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend Unit Tests
        working-directory: frontend
        run: pnpm test:unit

      - name: Unit & Build
        working-directory: frontend
        run: pnpm build

  # ---- E2E / Integration Tests ----
  test-e2e:
    name: test:e2e
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (Chromium only)
        working-directory: frontend
        run: pnpm exec playwright install chromium --with-deps

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: E2E / Integration Tests
        working-directory: frontend
        run: pnpm exec playwright test tests/e2e/lightbox-loading-policy.spec.ts tests/e2e/gallery-no-reload.spec.ts tests/e2e/gallery-cache-revisit.spec.ts tests/e2e/search-fielded-ui.spec.ts --project=chromium --reporter=html
        env:
          VITE_COVERAGE: "true"

      - name: Generate coverage report
        working-directory: frontend
        run: pnpm coverage:report

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: |
            frontend/coverage/
            frontend/.nyc_output/

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-contract
          path: frontend/playwright-report/
          retention-days: 7
