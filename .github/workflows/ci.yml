# GitHub Actions CI — Lint, format, build, test, and docs/test audit
#
# Runs on push/PR to main.
# All lint, format, unit, functional E2E, performance, and docs/test-catalog checks scan the full codebase.
# Where practical, CI delegates to ./test.sh to keep local and CI commands in sync.
---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.14.8

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint and format check (via test.sh)
        run: ./test.sh lint

  test-unit:
    name: test:unit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Unit tests, coverage, and build (via test.sh)
        run: ./test.sh unit

      - name: Upload backend coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: coverage.xml

      - name: Upload frontend unit coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend-unit
          path: frontend/coverage/vitest/

  test-docs:
    name: test:docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Docs staleness, test headers, and matrix audit (via test.sh)
        run: ./test.sh docs

  # ---- E2E / Integration Tests ----
  test-e2e:
    name: test:e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (Chromium only)
        working-directory: frontend
        run: pnpm exec playwright install chromium --with-deps

      - name: Create deterministic gallery fixture
        run: |
          python scripts/create_perf_fixture.py \
            --root "$RUNNER_TEMP/gallery-e2e-fixture" \
            --album-name a1111 \
            --images 30 \
            --metadata-db "$RUNNER_TEMP/gallery-e2e.db" \
            --thumbnail-cache "$RUNNER_TEMP/gallery-e2e-cache" \
            --clean

      - name: Start backend fixture
        run: |
          PATH_SAFETY_ROOT="$RUNNER_TEMP/gallery-e2e-fixture" \
          GALLERY_METADATA_DB="$RUNNER_TEMP/gallery-e2e.db" \
          GALLERY_THUMBNAIL_CACHE_DIR="$RUNNER_TEMP/gallery-e2e-cache" \
          ENABLE_METRICS=false \
          GALLERY_INTEGRITY_CHECK_ENABLED=false \
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 4180 \
            >"$RUNNER_TEMP/gallery-e2e-backend.log" 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4180/api/health >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/gallery-e2e-backend.log"
          exit 1

      - name: E2E / Integration Tests (all functional specs)
        working-directory: frontend
        run: pnpm exec playwright test tests/e2e/*.spec.ts --project=chromium --shard=${{ matrix.shard }}/4 --reporter=html
        env:
          VITE_API_URL: http://127.0.0.1:4180
          PATH_SAFETY_ROOT_PATH: ${{ runner.temp }}/gallery-e2e-fixture

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-functional-${{ matrix.shard }}
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-log-functional-${{ matrix.shard }}
          path: ${{ runner.temp }}/gallery-e2e-backend.log
          retention-days: 7

  test-perf:
    name: test:perf
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (Chromium only)
        working-directory: frontend
        run: pnpm exec playwright install chromium --with-deps

      - name: Validate performance budget registry
        run: python scripts/check_perf_budgets.py

      - name: Create deterministic performance fixture
        run: |
          python scripts/create_perf_fixture.py \
            --root "$RUNNER_TEMP/gallery-perf-fixture" \
            --album-name a1111 \
            --images 30 \
            --metadata-db "$RUNNER_TEMP/gallery-perf.db" \
            --thumbnail-cache "$RUNNER_TEMP/gallery-perf-cache" \
            --clean

      - name: Start performance backend fixture
        run: |
          PATH_SAFETY_ROOT="$RUNNER_TEMP/gallery-perf-fixture" \
          GALLERY_METADATA_DB="$RUNNER_TEMP/gallery-perf.db" \
          GALLERY_THUMBNAIL_CACHE_DIR="$RUNNER_TEMP/gallery-perf-cache" \
          ENABLE_METRICS=false \
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 4180 \
            >"$RUNNER_TEMP/gallery-perf-backend.log" 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4180/api/health >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/gallery-perf-backend.log"
          exit 1

      - name: Performance tests (all perf specs)
        working-directory: frontend
        run: pnpm exec playwright test tests/e2e/perf --project=chromium --workers=1 --reporter=html
        env:
          VITE_API_URL: http://127.0.0.1:4180
          PATH_SAFETY_ROOT_PATH: ${{ runner.temp }}/gallery-perf-fixture

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-reports
          path: |
            frontend/test-results/perf/
            frontend/playwright-report/
          retention-days: 14

      - name: Upload performance backend log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-log-performance
          path: ${{ runner.temp }}/gallery-perf-backend.log
          retention-days: 7
