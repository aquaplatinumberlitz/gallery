# GitHub Actions CI — Lint, format, build, and test
#
# Runs on push/PR to main.
# All lint, format, unit, functional E2E, and performance checks scan the full codebase.
---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # ---- Backend (Ruff) ----
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.14.8

      - name: Backend Ruff lint (full codebase)
        run: python -m ruff check backend scripts start.py

      - name: Backend Ruff format check (full codebase)
        run: python -m ruff format --check backend scripts start.py

      # ---- Frontend (ESLint + Prettier) ----
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend ESLint (source and tests)
        working-directory: frontend
        run: |
          pnpm lint
          pnpm lint:tests

      - name: Frontend Prettier check (full codebase)
        working-directory: frontend
        run: pnpm format:check

  test-unit:
    name: test:unit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Backend Unit & Integration Tests
        run: python -m pytest backend/tests/ -x -q --cov=backend --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Upload backend coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: coverage.xml

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend Unit Tests
        working-directory: frontend
        run: pnpm test:unit

      - name: Unit & Build
        working-directory: frontend
        run: pnpm build

  # ---- E2E / Integration Tests ----
  test-e2e:
    name: test:e2e
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (Chromium only)
        working-directory: frontend
        run: pnpm exec playwright install chromium --with-deps

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Start backend fixture
        run: |
          GALLERY_ROOT="$GITHUB_WORKSPACE/test-images" \
          GALLERY_METADATA_DB="$RUNNER_TEMP/gallery-e2e.db" \
          GALLERY_THUMBNAIL_CACHE_DIR="$RUNNER_TEMP/gallery-e2e-cache" \
          ENABLE_METRICS=false \
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 4180 \
            >"$RUNNER_TEMP/gallery-e2e-backend.log" 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4180/api/health >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/gallery-e2e-backend.log"
          exit 1

      - name: E2E / Integration Tests (all functional specs)
        working-directory: frontend
        run: pnpm exec playwright test tests/e2e/*.spec.ts --project=chromium --reporter=html
        env:
          VITE_COVERAGE: "true"
          VITE_API_URL: http://127.0.0.1:4180
          GALLERY_ROOT_PATH: ${{ github.workspace }}/test-images

      - name: Generate coverage report
        if: always()
        working-directory: frontend
        run: pnpm coverage:report

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: |
            frontend/coverage/
            frontend/.nyc_output/

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-contract
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-log-functional
          path: ${{ runner.temp }}/gallery-e2e-backend.log
          retention-days: 7

  test-perf:
    name: test:perf
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (Chromium only)
        working-directory: frontend
        run: pnpm exec playwright install chromium --with-deps

      - name: Validate performance budget registry
        run: python scripts/check_perf_budgets.py

      - name: Start performance backend fixture
        run: |
          GALLERY_ROOT="$GITHUB_WORKSPACE/test-images" \
          GALLERY_METADATA_DB="$RUNNER_TEMP/gallery-perf.db" \
          GALLERY_THUMBNAIL_CACHE_DIR="$RUNNER_TEMP/gallery-perf-cache" \
          ENABLE_METRICS=false \
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 4180 \
            >"$RUNNER_TEMP/gallery-perf-backend.log" 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4180/api/health >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/gallery-perf-backend.log"
          exit 1

      - name: Performance tests (all perf specs)
        working-directory: frontend
        run: pnpm exec playwright test tests/e2e/perf --project=chromium --workers=1 --reporter=html
        env:
          VITE_API_URL: http://127.0.0.1:4180
          GALLERY_ROOT_PATH: ${{ github.workspace }}/test-images

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-reports
          path: |
            frontend/test-results/perf/
            frontend/playwright-report/
          retention-days: 14

      - name: Upload performance backend log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-log-performance
          path: ${{ runner.temp }}/gallery-perf-backend.log
          retention-days: 7
