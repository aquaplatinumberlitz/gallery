# GitHub Actions CI — Lint, format, build, test, and docs/test audit
#
# Runs on push/PR to main.
# All lint, format, unit, functional E2E, performance, and docs/test-catalog checks scan the full codebase.
# CI delegates test execution to ./test.sh to keep local and CI commands in sync.
---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.14.8

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint and format check (via test.sh)
        run: ./test.sh lint

  test-unit:
    name: test:unit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Unit tests, coverage, and build (via test.sh)
        run: ./test.sh unit

      - name: Upload backend coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: coverage.xml

      - name: Upload frontend unit coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend-unit
          path: frontend/coverage/vitest/

  test-docs:
    name: test:docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Docs staleness, test headers, and matrix audit (via test.sh)
        run: ./test.sh docs

  # ---- E2E / Integration Tests ----
  test-e2e:
    name: test:e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (Chromium only)
        working-directory: frontend
        run: pnpm exec playwright install chromium --with-deps

      - name: E2E / Integration Tests (via test.sh)
        run: ./test.sh e2e
        env:
          GALLERY_TEST_BACKEND_PORT: "4180"
          GALLERY_TEST_SHARD: ${{ matrix.shard }}/4
          GALLERY_TEST_SKIP_BUILD: "1"
          GALLERY_TEST_TMPDIR: ${{ runner.temp }}/gallery-e2e-${{ matrix.shard }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-functional-${{ matrix.shard }}
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-log-functional-${{ matrix.shard }}
          path: ${{ runner.temp }}/gallery-e2e-${{ matrix.shard }}/backend.log
          retention-days: 7

  test-perf:
    name: test:perf
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (Chromium only)
        working-directory: frontend
        run: pnpm exec playwright install chromium --with-deps

      - name: Performance tests (via test.sh)
        run: ./test.sh perf
        env:
          GALLERY_TEST_BACKEND_PORT: "4180"
          GALLERY_TEST_SKIP_BUILD: "1"
          GALLERY_TEST_TMPDIR: ${{ runner.temp }}/gallery-perf

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-reports
          path: |
            frontend/test-results/perf/
            frontend/playwright-report/
          retention-days: 14

      - name: Upload performance backend log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-log-performance
          path: ${{ runner.temp }}/gallery-perf/backend.log
          retention-days: 7
