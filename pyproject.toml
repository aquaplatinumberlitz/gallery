[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
  "backend/venv",
  "backend/.venv_linux",
  "frontend",
  "test-images",
  "test-results",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "I", "SIM", "C4", "D"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["D"]
"backend/tests/*.py" = ["D"]
"scripts/audit_test_matrix.py" = ["D"]
"scripts/test_*.py" = ["D"]
"scripts/**/test_*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*", "tests/*", "backend/main.py", "main.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true

[tool.pytest.ini_options]
# BL-14: a SQLite connection that is garbage collected while still open is a leak. Python reports it as a
# ResourceWarning raised inside __del__, which pytest surfaces as PytestUnraisableExceptionWarning ("Exception
# ignored in: <sqlite3.Connection ..."), so both are turned into errors. The filters match sqlite connections
# only; every other ResourceWarning or unraisable exception keeps its default (reported, not failing) behaviour.
filterwarnings = [
  "error:unclosed database:ResourceWarning",
  "error:Exception ignored in. <sqlite3.Connection:pytest.PytestUnraisableExceptionWarning",
]
