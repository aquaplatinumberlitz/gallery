[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
  "backend/venv",
  "backend/.venv_linux",
  "frontend",
  "test-images",
  "test-results",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "I", "SIM", "C4", "D"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["D"]
"backend/tests/*.py" = ["D"]
"scripts/test_*.py" = ["D"]
"scripts/**/test_*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*"]
